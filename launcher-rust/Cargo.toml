[package]
name = "spartanport-launcher"
version = "2.6.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "spartanport_launcher"

[[bin]]
name = "spartanport-launcher"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
