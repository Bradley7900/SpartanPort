[package]
name = "spartanport-launcher"
version = "2.6.0"
edition = "2021"
rust-version = "1.87"

[lib]
name = "spartanport_launcher"

[[bin]]
name = "spartanport-launcher"
path = "src/main.rs"

[[bin]]
name = "fake-game"
path = "src/bin/fake_game.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
iced = { version = "0.14", features = ["wgpu", "tiny-skia", "image", "canvas", "advanced", "tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "signal"] }

[dev-dependencies]
iced_test = "0.14"

# The snapshot tests draw 2× frames with tiny-skia and pass them through PNG files; unoptimized,
# one 1920 × 1080 window takes about 20 s.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.iced_tiny_skia]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
