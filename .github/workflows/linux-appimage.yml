# Linux AppImage: built on Ubuntu 24.04 so it starts on glibc 2.39 or newer (SteamOS, Bazzite/Fedora,
# Debian 13, Ubuntu 24.04+; #291), then opened on those distros before it is published. Run by hand
# (Actions > Linux AppImage > Run workflow), on the branch to build:
#   - no tag: build and test only (the AppImage is kept as a workflow artifact).
#   - tag of an existing release (e.g. windows-v2.2.0): the AppImage replaces the one attached to it.
#   - new tag (e.g. linux-v2.2.1-test1): test build, published as a pre-release on that commit.
name: Linux AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the AppImage to; a new tag makes a test pre-release. Empty builds only.
        required: false

permissions:
  contents: write

concurrency:
  group: linux-appimage-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: bash packaging/linux/ci-deps.sh
      - name: ISA stub tests (fast bextr/blsr stubs against the CPU)
        run: |
          grep -m1 -o -w bmi1 /proc/cpuinfo || echo "no bmi1 on this runner"
          mkdir -p out
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -mgeneral-regs-only -c src/isa_emulate.c -o out/isa_emulate.o
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -c src/isa_rewrite.c -I. -Isrc -o out/isa_rewrite.o
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -mbmi -mlzcnt -I. -Isrc tests/test_isa_stub.c out/isa_rewrite.o out/isa_emulate.o -o out/isa-stub-test
          out/isa-stub-test tests/data/isa_fixture.bin
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -I. -Isrc tests/test_isa_fast.c out/isa_rewrite.o out/isa_emulate.o -o out/isa-fast-test
          out/isa-fast-test
      - name: Build
        run: bash build.sh
      - name: AppImage
        run: |
          PATH="$PWD/out/venv/bin:$PATH" bash packaging/linux/build.sh
          cd dist && sha256sum spartanport-x86_64.AppImage | sed 's/  / */' > spartanport-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: spartanport-x86_64.AppImage
          path: dist/spartanport-x86_64.AppImage*
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # debian:13 has SteamOS 3.7's glibc (2.41), fedora:42 is Bazzite's base.
        image: ['debian:13', 'fedora:42', 'ubuntu:24.04', 'archlinux:latest',
                'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spartanport-x86_64.AppImage
          path: dist
      - name: Open the launcher on ${{ matrix.image }}
        run: |
          chmod +x dist/spartanport-x86_64.AppImage
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" bash /w/packaging/linux/smoke-test.sh /w/dist/spartanport-x86_64.AppImage

  publish:
    needs: smoke
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spartanport-x86_64.AppImage
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Linux test build $TAG" \
              --notes "Linux test build from \`${GITHUB_SHA::7}\`. Download \`spartanport-x86_64.AppImage\`, then \`chmod +x spartanport-x86_64.AppImage\` and run it. Not a final release: please report in the linked issue whether it opens and runs."
          fi
          gh release upload "$TAG" dist/spartanport-x86_64.AppImage dist/spartanport-x86_64.AppImage.sha256 --clobber
